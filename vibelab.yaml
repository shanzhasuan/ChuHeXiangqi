      "description": "楚河棋社将传统象棋放进可环视的沉浸式棋社，在木桌上呈现水平摆放的3D棋盘和立体棋子。棋子带有清楚的红黑汉字，棋盘旁显示玩法、难度、关卡和当前回合，帮助你进入对局并掌握进程。玩家与对手走棋都有声音提示，最近移动的棋子分别使用金色和蓝色标记，方便找出对方刚走的位置。游戏支持随时保存本地对局与关卡进度，重新进入后继续。


